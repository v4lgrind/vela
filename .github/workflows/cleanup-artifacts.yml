name: Cleanup Old Artifacts

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of recent artifacts to keep for each platform'
        required: false
        default: '2'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keepCount = parseInt('${{ github.event.inputs.keep_count || 2 }}');

            console.log(`Keeping ${keepCount} recent artifacts for each platform...`);

            // Get all artifacts
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Found ${artifacts.length} total artifacts`);

            const artifactGroup = (name) => {
              const withoutCommit = name.replace(/-[0-9a-f]{40}$/i, '');
              if (withoutCommit.startsWith('jellyfin-v4lgrind-android')) return 'android';
              if (withoutCommit.startsWith('mediaserver-client-debug')) return 'android';
              if (withoutCommit.startsWith('jellyfin-v4lgrind-windows')) return 'windows';
              if (withoutCommit.startsWith('jellyfin-v4lgrind-linux')) return 'linux';
              return withoutCommit;
            };

            const groups = new Map();
            for (const artifact of artifacts) {
              const group = artifactGroup(artifact.name);
              const groupArtifacts = groups.get(group) || [];
              groupArtifacts.push(artifact);
              groups.set(group, groupArtifacts);
            }

            const artifactsToDelete = [];
            for (const [group, groupArtifacts] of groups) {
              groupArtifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              const expired = groupArtifacts.slice(keepCount);
              artifactsToDelete.push(...expired);
              console.log(`${group}: keeping ${Math.min(groupArtifacts.length, keepCount)}, deleting ${expired.length}`);
            }

            console.log(`Will delete ${artifactsToDelete.length} artifacts`);

            // Delete old artifacts
            let deletedCount = 0;
            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                console.log(`✓ Deleted: ${artifact.name} (ID: ${artifact.id}, created: ${artifact.created_at})`);
                deletedCount++;
              } catch (error) {
                console.error(`✗ Failed to delete artifact ${artifact.id}: ${error.message}`);
              }
            }

            console.log(`\nCleanup complete! Deleted ${deletedCount} of ${artifactsToDelete.length} artifacts.`);
            console.log(`Kept up to ${keepCount} recent artifacts for each platform.`);
