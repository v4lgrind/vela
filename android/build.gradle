// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // kotlin-stdlib 1.8+ merged the jdk7/jdk8 extension modules into the main artifact.
    // Old Cordova/Capacitor plugin subprojects still pull in the separate jdk7/jdk8 jars,
    // causing duplicate class errors. Force them to the same version as the main stdlib.
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '2.2.10'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
