name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Création idempotente : desktop-build.yml publie sur la même release
          # en parallèle, donc on ne supprime jamais la release existante.
          # Ce workflow est propriétaire du tag : on le déplace sur le commit
          # courant (gh release edit --target ne déplace pas un tag existant).
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly
          gh release create nightly \
            --title "Nightly Build" \
            --notes "Automated build from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --prerelease \
            --target "${{ github.sha }}" || true
          gh release edit nightly \
            --notes "Automated build from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M UTC')"
          gh release upload nightly \
            android/app/build/outputs/apk/debug/mediaserver-client.apk --clobber
