name: Release

# Manual, versioned release. Builds Android, Windows and Linux from the selected
# commit, then publishes every platform artifact in one GitHub release.
#
# The APK remains debug-signed with the committed fixed keystore so it installs
# over an existing build. Android versionCode and all package versions are
# derived from the requested semantic version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version semver, ex. 1.0.0 (sans le préfixe v)"
        required: true
        type: string
      prerelease:
        description: "Marquer comme prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate version and compute Android versionCode
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide '$VERSION' — attendu MAJOR.MINOR.PATCH (ex. 1.0.0)"
            exit 1
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::La release ${{ steps.version.outputs.tag }} existe déjà."
            exit 1
          fi

  android:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Android version
        shell: bash
        run: |
          # build.gradle reads ANDROID_VERSION_CODE (its versionCode spans two
          # lines, so rewriting it with sed broke the Gradle file).
          echo "ANDROID_VERSION_CODE=${{ needs.prepare.outputs.code }}" >> "$GITHUB_ENV"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ needs.prepare.outputs.version }}\"/" android/app/build.gradle
          grep -nE "versionName" android/app/build.gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Android release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/vela.apk \
             "release-assets/Vela-${{ needs.prepare.outputs.version }}-android.apk"

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: release-windows
            artifact-path: release/*.exe
          - os: ubuntu-22.04
            artifact-name: release-linux
            artifact-path: release/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply desktop version
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build desktop distributable
        run: npm run desktop:dist -- --publish never

      - name: Upload desktop release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs:
      - prepare
      - android
      - desktop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "Vela ${{ needs.prepare.outputs.tag }}" \
            --generate-notes \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            release-assets/*
