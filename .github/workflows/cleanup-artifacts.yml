name: Cleanup Old Artifacts

on:
  # Run daily at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of most recent artifacts to keep'
        required: false
        default: '2'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const keepCount = parseInt('${{ github.event.inputs.keep_count || 2 }}');

            console.log(`Keeping ${keepCount} most recent artifacts, deleting the rest...`);

            // Get all artifacts
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Found ${artifacts.length} total artifacts`);

            // Sort by created_at descending (newest first)
            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // Get artifacts to delete (all except the most recent ones)
            const artifactsToDelete = artifacts.slice(keepCount);

            console.log(`Will delete ${artifactsToDelete.length} artifacts`);

            // Delete old artifacts
            let deletedCount = 0;
            for (const artifact of artifactsToDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
                console.log(`✓ Deleted: ${artifact.name} (ID: ${artifact.id}, created: ${artifact.created_at})`);
                deletedCount++;
              } catch (error) {
                console.error(`✗ Failed to delete artifact ${artifact.id}: ${error.message}`);
              }
            }

            console.log(`\nCleanup complete! Deleted ${deletedCount} of ${artifactsToDelete.length} artifacts.`);
            console.log(`Kept ${keepCount} most recent artifacts.`);
