apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.jellyfin_v4lgrind_client.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jellyfin_v4lgrind_client.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Auto-increment from the CI run number so each published build is seen
        // as newer; falls back to 1 for local builds.
        def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
        versionCode ciRunNumber ? ciRunNumber.toInteger() : 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    // Fixed signing key so in-place updates work across builds. Without a stable
    // key, Android rejects the update (signature mismatch) and forces a reinstall.
    // This is a debug-grade key for this self-distributed Jellyfin client, not a Play key.
    signingConfigs {
        fixed {
            storeFile file('signing.keystore')
            storePassword 'mediaserver'
            keyAlias 'mediaserver'
            keyPassword 'mediaserver'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.fixed
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "mediaserver-client.apk"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    implementation "androidx.constraintlayout:constraintlayout:2.2.1"

    def media3_version = "1.5.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    // FFmpeg audio decoder sources included directly (not on Maven) — see
    // android/app/src/main/java/androidx/media3/decoder/ffmpeg/
    // Pre-built native libs in android/app/src/main/jniLibs/
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"

    // Google Cast SDK
    implementation "com.google.android.gms:play-services-cast-framework:21.5.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
