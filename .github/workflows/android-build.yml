name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default packages include the removed SDK "tools"
          # package, which makes sdkmanager fail. Match Dockerfile.android.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build web app
        run: npm run build:skip-types

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      # Une prerelease par commit de main, pour garder un historique des builds
      # téléchargeables. desktop-build.yml publie ses distribuables sur la même
      # release : le tag est donc dérivé du commit (et non de la date du run)
      # pour que les deux workflows calculent la même valeur.
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .github/scripts/nightly-tag.sh

          gh release create "$NIGHTLY_TAG" \
            --title "Nightly $NIGHTLY_DATE ($NIGHTLY_SHA7)" \
            --notes "Build automatique de \`main\` — commit ${{ github.sha }}" \
            --prerelease \
            --target "${{ github.sha }}" || true
          gh release upload "$NIGHTLY_TAG" \
            android/app/build/outputs/apk/debug/mediaserver-client.apk --clobber

      # Purge dans ce seul workflow pour éviter les suppressions concurrentes.
      # Ne touche jamais aux 3 plus récentes, dont celle du build en cours.
      - name: Prune old nightly releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: '3'
        run: .github/scripts/prune-nightlies.sh
