name: Build Desktop Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: vela-windows
          - os: ubuntu-22.04
            artifact-name: vela-linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop distributables
        run: npm run desktop:dist -- --publish never

      # Publié en asset de release plutôt qu'en artefact : le stockage des
      # releases n'est pas décompté du quota Actions, contrairement aux
      # artefacts (215 Mo par push sur main auparavant).
      - name: Publish to nightly release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Aucun distribuable trouvé dans release/"
            exit 1
          fi

          source .github/scripts/nightly-tag.sh

          # Création idempotente : android-build.yml publie sur la même release
          # en parallèle, l'un des deux la crée et l'autre échoue sans dommage.
          gh release create "$NIGHTLY_TAG" \
            --title "Nightly $NIGHTLY_DATE ($NIGHTLY_SHA7)" \
            --notes "Build automatique de \`main\` — commit ${{ github.sha }}" \
            --prerelease \
            --target "${{ github.sha }}" || true
          gh release upload "$NIGHTLY_TAG" "${files[@]}" --clobber
